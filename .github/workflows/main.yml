name: Compile LaTeX Resume

on:
  push:
    branches: [ main, master ]
    paths:
      - 'assets/resume.tex'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'assets/resume.tex'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write  # Allow the action to commit files back to the repo

jobs:
  compile-latex:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
    
    - name: Install LaTeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra
    
    - name: Compile LaTeX to PDF
      run: |
        cd assets
        pdflatex -interaction=nonstopmode resume.tex
        # Run twice to resolve references
        pdflatex -interaction=nonstopmode resume.tex
    
    - name: Check if PDF was created
      run: |
        if [ -f assets/resume.pdf ]; then
          echo "✅ PDF compilation successful"
          ls -la assets/resume.pdf
        else
          echo "❌ PDF compilation failed"
          exit 1
        fi
    
    - name: Commit and push PDF
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-compile LaTeX resume to PDF [skip ci]"
        file_pattern: "assets/resume.pdf"
        commit_user_name: "github-actions[bot]"
        commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
        commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
