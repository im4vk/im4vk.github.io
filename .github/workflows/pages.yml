name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 1 * *'   # refresh blog feeds once a month (1st day at 00:00 UTC)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Fetch blog feeds
        run: node scripts/build-feeds.mjs
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html feeds.json _site/
          cp -r assets _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
